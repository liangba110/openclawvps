# 服务存活 + 自动重启规则
- name: 同途搭子后端存活
  check:
    type: http
    url: http://127.0.0.1:5002/api/health
    timeout: 5
    expected_code: 200
  actions:
    - type: restart_systemd
      service: ttdazi
      cooldown: 300
      max_retries: 3
      on_failure: escalate
    - type: notify
      severity: warn
      message: "🔄 同途搭子后端已自动重启（第{count}次）"
      when: always

- name: 支付网关存活
  check:
    type: http
    url: http://127.0.0.1:5005/pay
    timeout: 5
    expected_code: 200
  actions:
    - type: restart_systemd
      service: ttdazi-pay
      cooldown: 300
      max_retries: 3
      on_failure: escalate
    - type: notify
      severity: critical
      message: "💳 支付网关已自动重启（第{count}次）"
      when: always

