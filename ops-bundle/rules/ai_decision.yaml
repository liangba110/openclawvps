# 智能运维V2 — AI决策规则
llm:
  provider: mimo
  model: mimo-v2.5-pro
  base_url: "https://token-plan-cn.xiaomimimo.com/v1"
  max_tokens: 2000
  temperature: 0.1
  timeout: 60
  retries: 3

# LLM适用场景
use_llm_for:
  - unknown_errors
  - complex_root_cause
  - architecture_advice
  - performance_tuning

# 规则引擎直接处理
rules_for:
  - service_restart
  - disk_cleanup
  - ssl_renewal
  - known_errors

# 决策阈值
decision:
  min_confidence: 0.6
  high_risk_threshold: 0.8
  auto_execute_max_risk: low

# 学习配置
learning:
  min_samples_for_rule: 3
  min_success_rate: 0.7
  decay_days: 90
